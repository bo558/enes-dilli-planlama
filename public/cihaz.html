<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Düzen · Mobil önizleme</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0c1522; font-family: system-ui, 'Segoe UI', sans-serif; color: #c9d3e2; }
      main { min-height: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 48px; padding: 24px; box-sizing: border-box; }
      .note { max-width: 300px; }
      .note h1 { color: #fff; font-size: 26px; margin: 0 0 10px; letter-spacing: -0.02em; }
      .note p { margin: 0 0 12px; font-size: 14.5px; line-height: 1.5; }
      .note a { color: #f4b85e; font-weight: 700; }
      .phone { width: 390px; height: 800px; max-height: calc(100vh - 48px); padding: 12px; border-radius: 52px; background: #05090f; box-shadow: 0 0 0 2px #2a3a52, 0 40px 90px -30px #000; box-sizing: content-box; }
      iframe { width: 100%; height: 100%; border: 0; border-radius: 40px; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <section class="note">
        <h1>Mobil önizleme</h1>
        <p>Uygulama telefon genişliğinde çalışır. Masaüstü görünümüyle aynı tarayıcı verisini kullanır.</p>
        <p>Bu çerçeve yalnızca sunum içindir; gerçek telefon cihazını temsil etmez.</p>
        <p><a href="./index.html" target="_blank" rel="noreferrer">Masaüstü görünümünü aç</a></p>
      </section>
      <div class="phone"><iframe src="./index.html" title="Düzen mobil görünüm"></iframe></div>
    </main>
  </body>
</html>
